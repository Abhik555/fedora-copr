name: Update Prism Launcher RPM

on:
  schedule:
    # Check upstream once per day.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream Prism Launcher release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          latest="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/PrismLauncher/PrismLauncher/releases/latest |
            jq -r '.tag_name'
          )"

          if [[ -z "$latest" || "$latest" == "null" ]]; then
            echo "Could not determine the latest Prism Launcher release."
            exit 1
          fi

          # Prism Launcher release tags are normally plain versions.
          # Strip a leading 'v' if upstream ever adds one.
          latest="${latest#v}"

          if [[ ! "$latest" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Unexpected upstream version: $latest"
            exit 1
          fi

          current="$(sed -n 's/^Version:[[:space:]]*//p' prismlauncher.spec | head -n1)"

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

          echo "Current RPM version: $current"
          echo "Latest upstream version: $latest"

      - name: Update spec file
        if: steps.release.outputs.latest != steps.release.outputs.current
        shell: bash
        run: |
          set -euo pipefail

          latest="${{ steps.release.outputs.latest }}"

          sed -i -E \
            "s/^Version:[[:space:]]+.*/Version:          ${latest}/" \
            prismlauncher.spec

          grep -q "^Version:[[:space:]]*${latest}$" prismlauncher.spec

      - name: Verify source archive exists
        if: steps.release.outputs.latest != steps.release.outputs.current
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.latest }}"
          url="https://github.com/PrismLauncher/PrismLauncher/releases/download/${version}/PrismLauncher-${version}.tar.gz"

          echo "Checking: $url"
          curl -fsIL --retry 3 --retry-delay 2 "$url" >/dev/null

      - name: Commit and push update
        if: steps.release.outputs.latest != steps.release.outputs.current
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.latest }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prismlauncher.spec
          git commit -m "Update Prism Launcher to ${version}"
          git push

      - name: No update required
        if: steps.release.outputs.latest == steps.release.outputs.current
        run: echo "Prism Launcher is already up to date."
